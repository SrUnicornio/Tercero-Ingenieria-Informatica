<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica 7 - Canvas Figuras | Álvaro Pérez Ramos</title>
  <link rel="stylesheet" href="shape-style.css">
  <script type="module" src="shape-client.js" defer></script>
</head>

<body>
  <header>
    <h1>Figuras en Canvas</h1>
    <h2>Autor: Álvaro Pérez Ramos</h2>
  </header>
  
  <nav class="nav-bottom">
    <a href="/">Inicio</a>
    <a href="/alvaro-perez-ramos-shapes.html">Canvas</a>
    <a href="/alvaro-perez-ramos-evaluation.html">Evaluación</a>
    <a href="/docs">Documentación</a>
  </nav>

  <main>
    <section class="canvas-container">
      <canvas id="canvas"></canvas>
    </section>

    <section class="controls">
      <fieldset id="shape-selector">
        <legend>Select a shape</legend>
      </fieldset>

      <fieldset class="inputs">
        <legend>Params</legend>
      
        <label>
          Color:
          <input type="color" id="color">
        </label>
      
        <label>
          Coordinate X:
          <input type="number" id="posX" value="100">
        </label>
      
        <label>
          Coordinate Y:
          <input type="number" id="posY" value="100">
        </label>
      
        <label>
          Rotation (degrees):
          <input type="number" id="rotacion" value="0">
        </label>
      
        <div id="shape-params"></div>
      
      </fieldset>

      <!-- <div class="buttons">
        <button id="btnDraw">Draw</button>
        <button id="btnClear">Clear</button>
        <button id="btnRandom">Random</button>
      </div> -->

    </section>

  </main>
</body>

</html>
