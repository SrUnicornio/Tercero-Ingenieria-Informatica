    SPA de la calculadora de áreas por la regla del trapecio.
    Layout: navbar propia fija + main flex (canvas + controles) + footer fijo.

    Responsabilidades de Bulma:
      - .field / .label / .control : estructura de campos de formulario.
      - .input                     : estilo de los inputs.
      - .button                    : estilo base del botón Update.
      - .has-addons                : alinea el prefijo "y =" con el input.
      - .is-hidden                 : oculta el párrafo de error.

    Rutas relativas desde src/exercises/home-work/trapezoid/:
      Índice:     ../../../../index.html
      UML:        ../uml/uml.html

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Álvaro Pérez Ramos — Trapezoidal Rule — PAI P14</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css" />
  <link rel="stylesheet" href="./trapezoid.css" />
  <script type="module" src="./trapezoid-client.ts"></script>
</head>

<body>

  <!-- ═══════════════════════════════════════════════════════════
       Navbar
  ════════════════════════════════════════════════════════════ -->
  <nav class="site-nav" role="navigation" aria-label="navegación principal">
    <span class="site-nav__brand">
      PAI · P14 — Álvaro Pérez Ramos
    </span>
    <div class="site-nav__links">
      <a href="../../../../index.html">← Índice</a>
      <a href="../uml/uml.html">UML</a>
      <a href="../docs/index.html">TypeDoc</a>
      <a href="../../evaluation-exercise1-8-puzle/alvaro-perez-ramos-8-puzle.html">
        Sesión de evaluación
      </a>
    </div>
  </nav>

  <!-- ═══════════════════════════════════════════════════════════
       Layout principal
  ════════════════════════════════════════════════════════════ -->
  <main class="trap-layout" id="trap-layout">

    <!-- ── Columna izquierda: canvas ──────────────────────── -->
    <div class="trap-canvas-col">
      <canvas id="trap-canvas" class="trap-canvas"></canvas>
    </div>

    <!-- ── Columna derecha: panel de controles ────────────── -->
    <aside class="trap-controls">
      <div class="field">
        <label class="label trap-label" for="input-expression">
          Expression
        </label>
        <div class="field has-addons">
          <div class="control">
            <span class="button is-static trap-prefix">y =</span>
          </div>
          <div class="control is-expanded">
            <input class="input trap-input" type="text" id="input-expression" value="x^2 + 1" autocomplete="off"
              spellcheck="false" required />
          </div>
        </div>
      </div>

      <div class="field">
        <label class="label trap-label" for="input-trapezoids">
          Number of Trapezoids
        </label>
        <div class="control">
          <input class="input trap-input" type="number" id="input-trapezoids" value="4" min="1" max="1000" step="1"
            required />
        </div>
      </div>

      <div class="field">
        <label class="label trap-label" for="input-start">
          Start
        </label>
        <div class="control">
          <input class="input trap-input" type="number" id="input-start" value="0" step="any" required />
        </div>
      </div>

      <div class="field">
        <label class="label trap-label" for="input-end">
          End
        </label>
        <div class="control">
          <input class="input trap-input" type="number" id="input-end" value="2" step="any" required />
        </div>
      </div>

      <!-- Update -->
      <div class="field">
        <div class="control">
          <button class="button trap-button" id="btn-update" type="button">
            Update
          </button>
        </div>
      </div>

      <!-- Resultado -->
      <p class="trap-result" id="trap-result">
        Sum of all Trapezium areas: —
      </p>

      <!-- Error — visible solo cuando el modelo detecta start >= end -->
      <p class="trap-error is-hidden" id="trap-error" role="alert"></p>

    </aside>

  </main>

  <!-- ═══════════════════════════════════════════════════════════
       Footer
  ════════════════════════════════════════════════════════════ -->
  <footer class="custom-footer" role="contentinfo">
    <p>
      Programación de Aplicaciones Interactivas ·
      Grado en Ingeniería Informática ·
      Universidad de La Laguna · 2025–26
    </p>
  </footer>

</body>

</html>
