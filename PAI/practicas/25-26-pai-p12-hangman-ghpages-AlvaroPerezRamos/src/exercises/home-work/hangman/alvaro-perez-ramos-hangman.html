    Elementos de renderizado del ahorcado
    ──────────────────────────────────────
    Ambos elementos (#hangmanImage y #hangmanCanvas) conviven en el DOM.
    HangmanImageRenderer alterna su visibilidad por código según si la
    imagen PNG carga correctamente o no. HangmanCanvasRenderer solo usa
    el canvas y deja la imagen como está (oculta por CSS por defecto).
    No se alterna visibilidad mediante clases CSS: es responsabilidad
    exclusiva del renderer activo.
-->
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css" />
  <link rel="stylesheet" href="./style-hangman.css" />
  <script type="module" src="./hangman-client.ts"></script>
  <title>Álvaro Pérez Ramos — El Ahorcado — PAI P12</title>
</head>

<body>
  <nav class="site-nav" role="navigation" aria-label="main navigation">
    <span class="site-nav__brand">PAI · P12 — Álvaro Pérez Ramos</span>
    <div class="site-nav__links">
      <a href="../../../../index.html">← Índice</a>
      <a href="../uml/uml.html">UML</a>
      <a href="../docs/index.html">TypeDoc</a>
      <a href="../../evaluation-exercise1-title/alvaro-perez-ramos-evaluation.html">Sesión de
        evaluación</a>
    </div>
  </nav>

  <main class="app-container">

    <!--
      Sección izquierda: zona de renderizado del ahorcado.
      Contiene ambos elementos; el renderer activo decide cuál es visible.
      - #hangmanImage: oculto por defecto (display: none en CSS).
                       HangmanImageRenderer lo muestra si la imagen carga.
      - #hangmanCanvas: visible por defecto.
                        HangmanCanvasRenderer lo usa siempre.
                        HangmanImageRenderer lo usa como fallback si la imagen falla.
    -->
    <section id="section-canvas">
      <img id="hangmanImage" alt="Estado actual del ahorcado" />
      <canvas id="hangmanCanvas"></canvas>
    </section>

    <aside id="section-game-panel">
      <div class="game-group">
        <p class="game-group__label" id="categoryLabel">Países</p>
        <div id="wordDisplay" class="word-display"></div>
      </div>

      <div class="game-group">
        <p class="game-group__label">Intentos restantes</p>
        <p id="remainingAttemptsDisplay" class="attempts-counter">6</p>
      </div>

      <div class="game-group">
        <p class="game-group__label">Letras falladas</p>
        <p id="failedLettersDisplay" class="failed-letters">—</p>
      </div>

      <div class="game-group">
        <p class="game-group__label">Letras</p>
        <div id="letterKeyboard" class="letter-keyboard"></div>
      </div>

      <div id="gameStatusMessage" class="game-status" aria-live="polite"></div>

      <div class="game-group">
        <button id="newGameButton" class="button is-dark is-fullwidth">
          Nueva partida
        </button>
      </div>

      <nav class="back-nav" role="navigation" aria-label="Volver al índice">
        <a href="../../../../index.html" class="button is-dark is-fullwidth">← Volver al índice</a>
      </nav>
    </aside>

  </main>

  <footer>
    <p>
      Programación de Aplicaciones Interactivas ·
      Grado en Ingeniería Informática ·
      Universidad de La Laguna · 2025–26
    </p>
  </footer>
</body>

</html>
